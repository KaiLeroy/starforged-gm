# Builds and publishes a Windows release whenever a version tag (v*) is pushed.
#
# Runs on GitHub's own windows-latest runner rather than the environment that develops this
# project -- deliberately, since that environment's network egress policy blocks
# uploads.github.com (the endpoint GitHub Releases requires for asset uploads, architecturally
# separate from api.github.com), which makes publishing impossible from there no matter how the
# request is made. This runner has no such restriction, and building natively on Windows also
# means no Wine cross-compilation step is needed here at all, unlike a Linux-hosted build.
#
# Publishing itself uses the GITHUB_TOKEN GitHub provides automatically to every workflow run,
# scoped to just this repo for the run's duration -- no personal access token is stored or used
# for this ongoing process.
name: Release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-release-tag.cjs
      - run: npm run verify

  release:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        run: npm run dist:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
