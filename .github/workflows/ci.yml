name: CI

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48

  windows-package-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run validate:json
      - name: Build Windows installer
        run: npm run dist:win -- --publish never
      - name: Launch packaged application
        shell: pwsh
        run: |
          $env:SCREENSHOT_PATH = "$PWD\packaged-smoke.png"
          $executable = Get-ChildItem -Path dist\win-unpacked -Filter *.exe | Select-Object -First 1
          if (-not $executable) { throw "Packaged executable not found." }
          $process = Start-Process -FilePath $executable.FullName -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged application did not finish its smoke run."
          }
          if (-not (Test-Path $env:SCREENSHOT_PATH)) { throw "Packaged application did not render a smoke screenshot." }
